<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join the Bogotá Chamber of Commerce">
    <meta name="author" content="Jean Marco Carnevali">
    <title>Bogotá Chamber of Commerce | Join</title>
    <meta property="og:title" content="Bogotá Chamber of Commerce | Join">
    <meta property="og:description" content="Join us at the Bogotá Chamber of Commerce">
    <meta property="og:image" content="https://jean-m-carnevali.github.io/wdd231/images/profile.jpg">
    <meta property="og:url" content="https://jean-m-carnevali.github.io/wdd231/chamber/directory.html">

    <link rel="icon" href="../cc-bogota.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/index.js" defer></script>
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/dates.js" defer></script>
</head>
<body>
    <header>
        <img src="images/chamber-logo.png" alt="Site Logo" width="512" height="512">
        <span>Bogotá Chamber of Commerce</span>
        <button id="menu" class="hamburger" aria-label="Toggle menu"></button>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li ><a href="index.html" aria-current="page">Home</a></li>
            <li><a href="directory.html">Directory</a></li>
            <li class="current"><a href="join.html" aria-current="page">Join</a></li>
            <li><a href="discover.html">Discover</a></li>
        </ul>
    </nav>
    <main id="main-content" class="chamber-home">

        <h1>Join</h1>

        <form method="get" action="thankyou.html">

            <label for="firstname">First name</label>
            <input type="text" name="firstname" autocomplete="given-name" required>

            <label for="firstname">Last name</label>
            <input type="text" name="lastname" autocomplete="family-name" required>

            <label for="org-title">Organizational Title</label>
            <input type="text" name="orgtitle" title="Enter your organization title (at least 7 letters)" autocomplete="organization-title" required>

            <label for="email">Email</label>
            <input type="email" name="email" title="Enter your email" autocomplete="email" placeholder="example@gmail.com" required>

            <label for="telephone">Mobile Phone</label>
            <input type="tel" name="phone" title="Enter your mobile phone" autocomplete="tel" required>

            <label for="business">Business Name</label>
            <input type="text" name="organization" title="Enter your business name" autocomplete="organization" required>

            <label for="membership">Membership Level
                <select name="membership" title="Select your membership level" required>
                    <option value="">Select a membership</option>
                    <option value="np">NP Membership</option>
                    <option value="bronze">Bronze Membership</option>
                    <option value="silver">Silver Membership</option>
                    <option value="gold">Gold Membership</option>
                </select>
            </label>
            <label for="description">Business Description
                <textarea name="description" title="Describe your business" rows="5"></textarea>
            </label>

            <input type="hidden" name="timestamp" id="timestamp">
            <input type="submit" value="Submit">
    </main>
    <footer>
        <div class="footer-contact">
            <h2>Bogotá Chamber of Commerce</h2>
            <p>Bogotá, Colombia</p>
            <p>contact@example.com</p>
            <p>+57 123 4567891</p>
        </div>
        <div class="social">
            <a href="https://github.com/jean-m-carnevali/wdd231" target="_blank"><img src="images/github.svg" alt="Github Profile" width="16" height="16"></a>
            <a href="https://www.linkedin.com/in/jean-marco-carnevali-rodriguez-9670193b9/" target="_blank"><img src="images/linkedin.svg" alt="Linkedin Profile" width="16" height="16"></a>
            <a href="https://www.instagram.com/?hl=es" target="_blank"><img src="images/instagram.svg" alt="Instagram Profile" width="16" height="16"></a>
            <a href="https://www.youtube.com/" target="_blank"><img src="images/youtube.svg" alt="Youtube Channel" width="16" height="16"></a>
        </div>
        <div class="footer-info">
            <p>WDD 231 Chamber Project</p>
            <p>Jean Marco Carnevali</p>
            <p>©<span id="currentyear"></span> Bogotá Chamber of Commerce</p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>
</html>
